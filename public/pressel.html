<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Conversas</title>
<style>
/* ============================================================================
   PRESSEL — página de pré-venda do funil (/p/:slug)
   Visual de app de conversas. NADA acontece sozinho (sem redirect automático,
   sem timer de navegação — o crawler do Meta vê uma página parada). Qualquer
   TOQUE do lead abre o funil /f/:slug no navegador externo (Android: intent://
   pro Chrome com fallback; iOS/desktop: navegação normal). UTMs preservadas.
   ============================================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f6f5f3; color: #1b1b1b; cursor: pointer;
    overflow-x: hidden;
}
.hdr { background: #fff; padding: 18px 20px 14px; border-bottom: 1px solid #eceae6; }
.hdr h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
.sec { padding: 16px 20px 6px; font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #9a958d; text-transform: uppercase; }
/* Status (stories) */
.statuses { display: flex; gap: 18px; padding: 10px 20px 18px; overflow-x: auto; background: #fff; scrollbar-width: none; }
.statuses::-webkit-scrollbar { display: none; }
.st { display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0; }
.st .ring { width: 68px; height: 68px; border-radius: 50%; padding: 3px; background: linear-gradient(45deg, #25a55f, #4CD964); }
.st .ring .ph { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; background: #ddd center/cover no-repeat; }
.st .nm { font-size: 13.5px; color: #444; }
.gap { height: 10px; background: #e9e6e0; }
/* Lista de conversas */
.list { background: #fff; }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid #f0eeea; }
.row .av { position: relative; width: 62px; height: 62px; border-radius: 50%; background: #ddd center/cover no-repeat; flex-shrink: 0; }
.row .av .dot { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; border-radius: 50%; background: #4CD964; border: 2.5px solid #fff; }
.row .mid { flex: 1; min-width: 0; }
.row .nm { font-size: 17.5px; font-weight: 700; color: #111; margin-bottom: 3px; }
.row .pv { font-size: 14.5px; color: #8a857d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .pv.online { color: #25a55f; }
.row .pv.typing { color: #25a55f; font-style: italic; }
.row .end { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
.row .tm { font-size: 12.5px; color: #25a55f; font-weight: 600; }
.row .badge { min-width: 21px; height: 21px; border-radius: 999px; background: #4CD964; color: #fff; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
.foot { text-align: center; padding: 22px 20px 30px; font-size: 12px; color: #b7b2a9; }
/* Banner flutuante "N novas mensagens" (pulsa a cada chegada) */
.newmsgs {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #1fa855; color: #fff; font-size: 14px; font-weight: 700;
    padding: 11px 20px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 8px 26px rgba(31,168,85,.45); z-index: 5;
    animation: nmPulse 1.8s ease-out infinite;
}
@keyframes nmPulse {
    0%   { box-shadow: 0 8px 26px rgba(31,168,85,.45), 0 0 0 0 rgba(31,168,85,.5); }
    70%  { box-shadow: 0 8px 26px rgba(31,168,85,.45), 0 0 0 14px rgba(31,168,85,0); }
    100% { box-shadow: 0 8px 26px rgba(31,168,85,.45), 0 0 0 0 rgba(31,168,85,0); }
}
</style>
</head>
<body>
<div class="hdr"><h1 id="headline">Conversas</h1></div>
<div class="sec">Status</div>
<div class="statuses" id="statuses"></div>
<div class="gap"></div>
<div class="sec">Minhas conversas</div>
<div class="list" id="list"></div>
<div class="foot">🔒 Suas conversas são protegidas</div>
<div class="newmsgs" id="newMsgs" style="display:none;">🔥 <span id="newMsgsN">1</span> nova mensagem</div>
<script>
var DATA = __PRESSEL_DATA__;
(function () {
    var cfg = DATA.config || {};
    var chats = DATA.chats || [];
    if (cfg.headline) document.getElementById('headline').textContent = cfg.headline;
    var previews = Array.isArray(cfg.previews) ? cfg.previews.filter(Boolean) : [];
    // Sem prévias configuradas no funil? Usa um conjunto padrão — a página
    // NUNCA fica parada: as mensagens começam a chegar assim que abre.
    if (!previews.length) {
        previews = ['oi amor, tá aí? 🥺', 'te mandei uma coisa... 👀', 'vamo conversar? 🔥'];
    }
    previews = previews.slice(0, chats.length);

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function hhmmAgo(minAgo) {
        var d = new Date(Date.now() - minAgo * 60000);
        return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }

    // Status (stories) — todas as modelos com anel verde
    document.getElementById('statuses').innerHTML = chats.map(function (c) {
        var bg = c.avatar_url ? ' style="background-image:url(\'' + esc(c.avatar_url) + '\')"' : '';
        return '<div class="st"><div class="ring"><div class="ph"' + bg + '></div></div><div class="nm">' + esc(c.name) + '</div></div>';
    }).join('');

    // Conversas: todas começam "online"; as mensagens CHEGAM ao vivo (sequência
    // abaixo) e ficam FIXAS — nada de aparecer e sumir.
    document.getElementById('list').innerHTML = chats.map(function (c, i) {
        var bg = c.avatar_url ? ' style="background-image:url(\'' + esc(c.avatar_url) + '\')"' : '';
        return '<div class="row" data-row="' + i + '"><div class="av"' + bg + '>' + (c.show_online !== false ? '<span class="dot"></span>' : '') + '</div>'
            + '<div class="mid"><div class="nm">' + esc(c.name) + '</div><div class="pv online" data-pv="' + i + '">' + esc(c.status_label || 'online') + '</div></div></div>';
    }).join('');

    // Sequência VIVA por conversa (só visual — nada navega sozinho):
    // digitando… → 📷 Foto (+1 não lida) → digitando… → mensagem configurada,
    // que fica FIXA com o contador. Uma conversa de cada vez, em fila.
    function bumpBadge(i) {
        var row = document.querySelector('[data-row="' + i + '"]');
        if (!row) return;
        var end = row.querySelector('.end');
        if (!end) {
            end = document.createElement('div');
            end.className = 'end';
            end.innerHTML = '<span class="tm" data-ts="' + Date.now() + '">agora</span><span class="badge">1</span>';
            row.appendChild(end);
        } else {
            var b = end.querySelector('.badge');
            if (b) b.textContent = String((parseInt(b.textContent, 10) || 0) + 1);
            var t = end.querySelector('.tm');
            if (t) { t.dataset.ts = String(Date.now()); t.textContent = 'agora'; }
        }
    }
    // Horários VIVOS: "agora" → "1 min" → "2 min"… atualiza a cada 20s
    setInterval(function () {
        var tms = document.querySelectorAll('.tm[data-ts]');
        for (var ti = 0; ti < tms.length; ti++) {
            var mins = Math.floor((Date.now() - parseInt(tms[ti].dataset.ts, 10)) / 60000);
            tms[ti].textContent = mins < 1 ? 'agora' : (mins + ' min');
        }
    }, 20000);
    // Contador de "novas mensagens": título da aba + banner verde pulsando
    var _arrived = 0, _baseTitle = document.title;
    function bumpTitle() {
        _arrived++;
        try { document.title = '(' + _arrived + ') ' + _baseTitle; } catch (e) {}
        try {
            var nm = document.getElementById('newMsgs');
            nm.innerHTML = '🔥 ' + _arrived + (_arrived > 1 ? ' novas mensagens' : ' nova mensagem');
            nm.style.display = 'block';
        } catch (e) {}
    }
    function seqChat(i, finalText, startMs) {
        var el = document.querySelector('[data-pv="' + i + '"]');
        if (!el) return;
        function typing() { el.textContent = 'digitando…'; el.className = 'pv typing'; }
        // varia o estímulo: conversas ímpares mandam ÁUDIO, pares mandam FOTO
        var midTxt = (i % 2 === 1)
            ? '🎤 Áudio 0:' + ('0' + (9 + (i * 7) % 39)).slice(-2)
            : '📷 Foto';
        setTimeout(typing, startMs);
        setTimeout(function () { el.textContent = midTxt; el.className = 'pv'; bumpBadge(i); bumpTitle(); }, startMs + 1700);
        setTimeout(typing, startMs + 3100);
        setTimeout(function () { el.textContent = finalText; el.className = 'pv'; el.dataset.fixed = '1'; bumpBadge(i); bumpTitle(); }, startMs + 4800);
    }
    // COMEÇA NA HORA: 1ª conversa digita em 400ms; as outras entram em fila
    for (var pi = 0; pi < previews.length && pi < chats.length; pi++) {
        seqChat(pi, previews[pi], 400 + pi * 2600);
    }

    // Nas conversas SEM mensagem configurada: "digitando…" sutil de vez em
    // quando, voltando pro online — não mexe nas que já têm mensagem fixa.
    var typingIdx = -1, typingOld = '';
    setInterval(function () {
        var els = Array.prototype.filter.call(document.querySelectorAll('[data-pv]'), function (e, idx) {
            return idx >= previews.length && e.dataset.fixed !== '1';
        });
        if (!els.length) return;
        if (typingIdx >= 0 && typingOld && els[typingIdx]) {
            els[typingIdx].textContent = typingOld;
            els[typingIdx].className = 'pv online';
        }
        typingIdx = Math.floor(Math.random() * els.length);
        typingOld = els[typingIdx].textContent;
        els[typingIdx].textContent = 'digitando…';
        els[typingIdx].className = 'pv typing';
    }, 3200);

    // ── QUALQUER toque leva pro funil (gesto do lead = permitido no webview) ──
    var went = false;
    function go() {
        if (went) return; went = true;
        try {
            if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/user/pressel/click',
                    new Blob([JSON.stringify({ funnel_slug: DATA.slug })], { type: 'application/json' }));
            }
        } catch (_) {}
        var qs = location.search || '';               // UTMs/fbclid seguem pro funil
        var path = '/f/' + DATA.slug + qs;
        var target = location.protocol + '//' + location.host + path;
        var isAndroid = /android/i.test(navigator.userAgent || '');
        if (isAndroid) {
            // Chrome via intent:// (funciona no webview do Insta/Face E no Chrome).
            // Se não abrir em ~1.8s (intent bloqueado), segue navegação normal.
            try {
                window.location.href = 'intent://' + location.host + path
                    + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='
                    + encodeURIComponent(target) + ';end';
            } catch (_) {}
            setTimeout(function () { window.location.href = target; }, 1800);
        } else {
            window.location.href = target;
        }
        setTimeout(function () { went = false; }, 3000); // deixa tentar de novo se voltar
    }
    // Só o CLICK (tap real): touchend dispararia também ao soltar um scroll,
    // o que viraria navegação acidental — e navegação "sozinha" é justamente
    // o padrão que o Meta pune.
    document.addEventListener('click', go, true);
})();
</script>
</body>
</html>
